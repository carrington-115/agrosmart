# Applies the schema to the throwaway Postgres.
#
# The SQL is MOUNTED from a ConfigMap built out of the real files in
# agroapp/supabase/migrations/ — see apply.sh. It is never copied into deploy/,
# because a second copy of the schema would drift, and a test against a drifted
# migration is worse than no test at all.
#
# Nothing waits on this Job. agroapi starts immediately and fails its readiness
# probe, because check_schema finds the 0002 columns missing, so its Service has
# no endpoints and no traffic reaches it. When this Job completes, the next
# readiness poll passes and the pods join the Service on their own. The readiness
# contract does the sequencing; there is no orchestration to get wrong.
#
# That is also the production failure mode this local run is meant to rehearse:
# the service deployed against a database where the migration was never pushed.

apiVersion: batch/v1
kind: Job
metadata:
  name: migrate
  labels:
    app.kubernetes.io/name: migrate
spec:
  backoffLimit: 10
  template:
    metadata:
      labels:
        app.kubernetes.io/name: migrate
        app.kubernetes.io/part-of: agrosmart
    spec:
      restartPolicy: OnFailure
      securityContext:
        runAsNonRoot: true
        runAsUser: 70
        runAsGroup: 70
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: psql
          image: postgres:16-alpine
          env:
            - name: PGPASSWORD
              value: postgres
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
          volumeMounts:
            - name: migrations
              mountPath: /migrations
              readOnly: true
          command: ["/bin/sh", "-c"]
          args:
            - |
              set -e

              # The Job may start before Postgres is accepting connections.
              # Waiting here is simpler than an initContainer and keeps the
              # failure legible if the database never arrives.
              for i in $(seq 1 60); do
                pg_isready -h postgres -U postgres -d agrosmart_test && break
                echo "waiting for postgres ($i)"; sleep 2
              done

              # Filename order is the apply order and it is load-bearing:
              # 0000_auth_stub creates auth.users, which 0001 references, which
              # 0002 alters.
              #
              # LC_ALL=C pins byte collation. Locale-aware sort ignores
              # punctuation, so a dev machine and this container can disagree
              # about where an underscore falls — and only the container's
              # opinion decides whether the migration works.
              #
              # --single-transaction so a failure rolls the file back whole.
              # Without it a half-applied 0001 leaves enums behind, and the
              # retry dies on "type already exists" — reporting a symptom of the
              # first failure instead of the failure itself.
              for f in $(ls /migrations/*.sql | LC_ALL=C sort); do
                echo "--- applying $(basename "$f")"
                psql -h postgres -U postgres -d agrosmart_test \
                     --single-transaction -v ON_ERROR_STOP=1 -q -f "$f"
              done

              echo "--- schema applied"
      volumes:
        - name: migrations
          configMap:
            name: agro-migrations
