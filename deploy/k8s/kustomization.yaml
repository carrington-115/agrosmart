# Apply order matters: the namespace must exist before anything lands in it, and
# the PSA labels on it must be in place before the first pod is admitted.
#
#   kubectl apply -k deploy/k8s
#
# Before the first apply, create the secret out of band — the committed manifest
# is a template with REPLACE_ME values:
#
#   kubectl -n agrosmart create secret generic agroapi-secrets \
#     --from-literal=AGRO_DATABASE_URL='postgresql://agro_api:...@...:5432/postgres' \
#     --from-literal=AGRO_TOKEN_PEPPER="$(openssl rand -hex 32)"

apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

namespace: agrosmart

resources:
  - namespace.yaml
  - agroapi.yaml
  - agroapp.yaml
  - ingress.yaml

commonLabels:
  app.kubernetes.io/part-of: agrosmart

images:
  # CI overrides these with an immutable digest per release; `latest` here is a
  # placeholder for a local `kubectl apply -k`, not a production intent.
  - name: ghcr.io/carrington-115/agroapi
    newTag: latest
  - name: ghcr.io/carrington-115/agroapp
    newTag: latest
