# SPDX-License-Identifier: MIT
#
# Automated code review on pull requests.
#
# REQUIRES A SECRET: add ANTHROPIC_API_KEY under
# Settings -> Secrets and variables -> Actions.
# Until then this workflow will appear on the repo and fail on the auth step.
# Get a key at https://console.anthropic.com/
#
# The prompt is deliberately project-specific, for the same reason the firmware
# repo's is (../agrosensor/.github/workflows/code-review.yml): a generic reviewer
# spends every pull request re-flagging the same documented non-bugs -- zero NPK
# in dry soil, npkEstimated always true -- while missing the things that are
# actually dangerous here, which are a leaked RLS scope and a null silently
# becoming zero.

name: Code Review

on:
  pull_request:
    types: [opened, synchronize, reopened]
  workflow_dispatch:

concurrency:
  group: review-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  review:
    name: Automated review
    runs-on: ubuntu-latest

    permissions:
      contents: read
      pull-requests: write
      issues: write
      id-token: write

    steps:
      - uses: actions/checkout@v4
        with:
          # Full history so the reviewer can diff against the base.
          fetch-depth: 0

      - name: Review pull request
        uses: anthropics/claude-code-action@v1
        with:
          anthropic_api_key: ${{ secrets.ANTHROPIC_API_KEY }}
          prompt: |
            Review this pull request and post your findings as a PR review.

            This repository holds the AgroSmart dashboard (agroapp/, Next.js 16)
            and backend (agroapi/, FastAPI). Read CLAUDE.md first -- it states the
            architectural rules and the three telemetry contract rules that most
            findings here will relate to.

            PRIORITISE, in order:

            1. TENANT ISOLATION. This is the highest-severity class of bug in this
               codebase.
               - Any query on a user-scoped connection that could return another
                 owner's rows.
               - Any use of the service connection (which BYPASSES RLS) without an
                 explicit owner_id predicate.
               - In agroapi/src/agroapi/db/session.py: any `set_config` whose third
                 argument is not `true`. A session-level setting persists on a
                 pooled connection and serves the NEXT request the previous user's
                 claims. Also flag any scoping that is not inside an explicit
                 transaction, because `set_config(..., true)` outside one is a
                 silent no-op.
               - Any new database role or connection string that connects as
                 `postgres`. It owns these tables and holds BYPASSRLS, so every
                 policy becomes inert.
               - New tables without RLS enabled, or with a policy that does not
                 scope to auth.uid().

            2. NULL BECOMING ZERO. The contract's first rule: absent readings are
               omitted, never zeroed, because pH 0.0 is a plausible-looking acid
               reading that nothing downstream can distinguish from a real one.
               Flag any `?? 0`, `or 0`, `float(x or 0)`, non-optional column, or
               default that turns a missing reading into a number. Flag any
               unguarded `.toFixed()` on a nullable value.

            3. Contract violations in ingest:
               - Defaulting any of the three `quality` flags instead of requiring
                 them. Their absence must never read as `false`.
               - Treating `soilDry` as a fault, or raising an alert on it.
               - Deriving fertiliser advice while `npkEstimated` is true.
               - Substituting arrival time for an implausible device `ts` instead
                 of rejecting it.
               - Accepting an unknown payload version rather than rejecting it.
               - Batch handling that fails the whole request for one bad item: a
                 device cannot drain its flash buffer past a poison-pill record.

            4. Violations of the architectural rules in CLAUDE.md:
               - agroapi/src/agroapi/domain/ must stay pure: no asyncpg, no
                 fastapi, no reading the clock. `now` is passed in.
               - Routers validate and wire; they contain no arithmetic.
               - Failure is a typed error, never a magic value.
               - Thresholds are imported from domain/thresholds.py, never re-typed.
               - Repository functions take a connection, never a pool or a Request.

            5. Secrets. Any service-role key reachable from browser code, any
               `NEXT_PUBLIC_` prefix on something that is not publishable, any
               credential in a committed file, Dockerfile ARG or k8s manifest.

            6. Test coverage for new logic, and whether new tests assert a
               requirement rather than restating the implementation.

            DO NOT FLAG THESE -- they are correct, deliberate and documented:

            - Zero N/P/K when conductivity is zero, and `soilDry` being true. The
              probe derives NPK from bulk EC, so dry soil legitimately reports
              zero. The reading is VALID, not a fault.
            - `npkEstimated` being unconditionally true. It stays true until
              per-soil coefficients are written to the probe hardware.
            - SHA-256/HMAC rather than argon2 for device tokens. Deliberate: these
              are 256-bit CSPRNG machine credentials verified every 60s per
              device, not human passwords. The reasoning is in auth/device.py.
            - `ph` being a generated column in migration 0002. Deliberate: it
              keeps dashboard reads working while making writes fail, which
              retires the old ingest route on contact.
            - The absence of Alembic. One applier only -- the Supabase CLI. See
              CLAUDE.md.
            - `AGRO_DB_POOL_MIN_SIZE` being 0, and the broad `except Exception` in
              the readiness probe. Both are explained in comments: the service
              must start when the database is down and report unready rather than
              crash-loop.
            - Known pre-existing issues listed under "Known state" in CLAUDE.md
              (the LineChart placeholder, unbounded getSensors(), duplicated
              thresholds, the display_name/name metadata mismatch). Only flag
              these if the PR makes one worse.

            Be concrete: name the file and line, and give a specific failure
            scenario with inputs. Do not restate what the code does. If you find
            nothing substantive, say so plainly rather than manufacturing filler.
          claude_args: '--max-turns 30'
