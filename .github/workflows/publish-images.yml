# SPDX-License-Identifier: MIT
#
# Publishes both images to GHCR on master and on a version tag.
#
# Split from the CI workflows on purpose: those run for pull requests, including
# from forks, and a fork PR must never hold registry credentials. Nothing here
# runs before the corresponding checks have passed on master.

name: Publish images

on:
  push:
    branches: [master]
    tags: ["v*"]
  workflow_dispatch:

concurrency:
  group: publish-${{ github.ref }}
  cancel-in-progress: false

jobs:
  publish:
    name: Build and push ${{ matrix.name }}
    runs-on: ubuntu-latest

    permissions:
      contents: read
      packages: write

    strategy:
      fail-fast: false
      matrix:
        include:
          - name: agroapi
            context: agroapi
          - name: agroapp
            context: agroapp

    steps:
      - uses: actions/checkout@v4

      # agroapp needs its NEXT_PUBLIC_* values at BUILD time — Next inlines them
      # into the client bundle, so an empty build arg produces an image that
      # cannot construct a Supabase client. Without this check the build dies
      # deep inside `pnpm build` with "@supabase/ssr: Your project's URL and API
      # key are required", naming neither the workflow nor the variable to set.
      #
      # This SKIPS rather than fails. A fork or a fresh clone has no repository
      # variables and cannot be expected to, so a red X there reports a
      # misconfiguration that does not exist. Publishing resumes automatically
      # once the variables are set — no workflow edit needed.
      #
      # Deliberately NOT defaulted to placeholders: a published image carrying
      # placeholder Supabase config is worse than no image at all, because it
      # looks deployable and fails only once it is in front of a user.
      #
      # agroapi takes no build args, so it is always considered configured.
      - name: Check build configuration
        id: config
        env:
          URL: ${{ vars.NEXT_PUBLIC_SUPABASE_URL }}
          KEY: ${{ vars.NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY }}
        run: |
          if [ "${{ matrix.name }}" != "agroapp" ]; then
            echo "configured=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          missing=""
          [ -n "$URL" ] || missing="$missing NEXT_PUBLIC_SUPABASE_URL"
          [ -n "$KEY" ] || missing="$missing NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY"

          if [ -n "$missing" ]; then
            echo "configured=false" >> "$GITHUB_OUTPUT"
            echo "::notice::Skipping agroapp publish — unset repository variables:$missing"
            {
              echo "### agroapp image not published"
              echo
              echo "Missing repository variables:\`$missing\`"
              echo
              echo "These are inlined into the client bundle at build time, so the"
              echo "image cannot be built without them. They are configuration, not"
              echo "secrets — the publishable key already ships to every browser."
              echo
              echo '```bash'
              echo "gh variable set NEXT_PUBLIC_SUPABASE_URL --body 'https://<ref>.supabase.co'"
              echo "gh variable set NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY --body 'sb_publishable_...'"
              echo '```'
            } >> "$GITHUB_STEP_SUMMARY"
          else
            echo "configured=true" >> "$GITHUB_OUTPUT"
          fi

      - if: steps.config.outputs.configured == 'true'
        uses: docker/setup-buildx-action@v3

      - if: steps.config.outputs.configured == 'true'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - id: meta
        if: steps.config.outputs.configured == 'true'
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository_owner }}/${{ matrix.name }}
          tags: |
            type=ref,event=branch
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            # Immutable, and the tag deployments should actually pin. A mutable
            # tag makes a rollback unreproducible, which is exactly when
            # reproducibility matters.
            type=sha,format=long

      # Both build-args are ignored by the agroapi Dockerfile, which declares no
      # ARG for them — harmless, and it keeps this a single matrixed step rather
      # than two near-identical ones.
      - name: Build and push
        if: steps.config.outputs.configured == 'true'
        uses: docker/build-push-action@v6
        with:
          context: ${{ matrix.context }}
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha,scope=${{ matrix.name }}
          cache-to: type=gha,mode=max,scope=${{ matrix.name }}
          build-args: |
            NEXT_PUBLIC_SUPABASE_URL=${{ vars.NEXT_PUBLIC_SUPABASE_URL }}
            NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY=${{ vars.NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY }}

      - name: Report digest to pin
        if: steps.config.outputs.configured == 'true'
        run: |
          echo "Deploy this, not a mutable tag:"
          echo "  ghcr.io/${{ github.repository_owner }}/${{ matrix.name }}@${{ steps.meta.outputs.digest || 'see build output' }}"
