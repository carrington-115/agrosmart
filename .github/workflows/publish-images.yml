# SPDX-License-Identifier: MIT
#
# Publishes both images to GHCR on master and on a version tag.
#
# Split from the CI workflows on purpose: those run for pull requests, including
# from forks, and a fork PR must never hold registry credentials. Nothing here
# runs before the corresponding checks have passed on master.

name: Publish images

on:
  push:
    branches: [master]
    tags: ["v*"]
  workflow_dispatch:

concurrency:
  group: publish-${{ github.ref }}
  cancel-in-progress: false

jobs:
  publish:
    name: Build and push ${{ matrix.name }}
    runs-on: ubuntu-latest

    permissions:
      contents: read
      packages: write

    strategy:
      fail-fast: false
      matrix:
        include:
          - name: agroapi
            context: agroapi
          - name: agroapp
            context: agroapp

    steps:
      - uses: actions/checkout@v4

      # Fail fast and say what is missing. Without this the agroapp build gets
      # empty NEXT_PUBLIC_* args and dies inside `pnpm build` with
      # "@supabase/ssr: Your project's URL and API key are required", which names
      # neither the workflow nor the variable you actually have to set.
      #
      # Deliberately NOT defaulted to placeholders: a published image with
      # placeholder Supabase config is worse than no image, because it looks
      # deployable and fails only in front of a user.
      - name: Require build configuration
        if: matrix.name == 'agroapp'
        env:
          URL: ${{ vars.NEXT_PUBLIC_SUPABASE_URL }}
          KEY: ${{ vars.NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY }}
          API: ${{ vars.NEXT_PUBLIC_API_BASE_URL }}
        run: |
          missing=""
          [ -n "$URL" ] || missing="$missing NEXT_PUBLIC_SUPABASE_URL"
          [ -n "$KEY" ] || missing="$missing NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY"
          [ -n "$API" ] || missing="$missing NEXT_PUBLIC_API_BASE_URL"
          if [ -n "$missing" ]; then
            echo "::error::Missing repository variables:$missing"
            echo "These are inlined into the client bundle at build time, so the"
            echo "image cannot be built without them. They are configuration, not"
            echo "secrets — the publishable key already ships to every browser."
            echo
            echo "Set them under Settings -> Secrets and variables -> Actions ->"
            echo "Variables, or with the CLI:"
            echo "  gh variable set NEXT_PUBLIC_SUPABASE_URL --body 'https://<ref>.supabase.co'"
            echo "  gh variable set NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY --body 'sb_publishable_...'"
            echo "  gh variable set NEXT_PUBLIC_API_BASE_URL --body 'https://api.<host>/v1'"
            exit 1
          fi

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository_owner }}/${{ matrix.name }}
          tags: |
            type=ref,event=branch
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            # Immutable, and the tag deployments should actually pin. A mutable
            # tag makes a rollback unreproducible, which is exactly when
            # reproducibility matters.
            type=sha,format=long

      # The frontend needs its NEXT_PUBLIC_* values at BUILD time, since Next
      # inlines them into the client bundle — setting them in the cluster would do
      # nothing. They are configuration, not secrets: the publishable key is
      # already served to every browser. Set them as repository variables under
      # Settings -> Secrets and variables -> Actions -> Variables.
      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: ${{ matrix.context }}
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha,scope=${{ matrix.name }}
          cache-to: type=gha,mode=max,scope=${{ matrix.name }}
          build-args: |
            NEXT_PUBLIC_SUPABASE_URL=${{ vars.NEXT_PUBLIC_SUPABASE_URL }}
            NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY=${{ vars.NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY }}
            NEXT_PUBLIC_API_BASE_URL=${{ vars.NEXT_PUBLIC_API_BASE_URL }}

      - name: Report digest to pin
        run: |
          echo "Deploy this, not a mutable tag:"
          echo "  ghcr.io/${{ github.repository_owner }}/${{ matrix.name }}@${{ steps.meta.outputs.digest || 'see build output' }}"
