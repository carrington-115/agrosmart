# SPDX-License-Identifier: MIT
#
# Backend CI.
#
# Ordered fastest-and-most-valuable first, mirroring ../agrosensor's CI: the pure
# suite needs no database, runs in about a second, and covers the envelope
# decoding where this service is most likely to be wrong. Everything slower runs
# only once that passes.

name: agroapi

on:
  push:
    branches: [master]
    paths:
      - "agroapi/**"
      - ".github/workflows/agroapi.yml"
  pull_request:
    paths:
      - "agroapi/**"
      - ".github/workflows/agroapi.yml"
  workflow_dispatch:

# A new push makes the previous run's answer irrelevant.
concurrency:
  group: agroapi-${{ github.ref }}
  cancel-in-progress: true

defaults:
  run:
    working-directory: agroapi

jobs:
  check:
    name: Lint, types, pure tests
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
          cache-dependency-glob: agroapi/uv.lock

      # --frozen so a lockfile that has drifted from pyproject.toml is a build
      # failure rather than a silent re-resolution that passes here and installs
      # something else in the image.
      - name: Install
        run: uv sync --frozen --all-extras

      - name: Lint
        run: uv run ruff check

      - name: Format check
        run: uv run ruff format --check

      # Strict, and not negotiable: db/session.py uses NewType over the
      # connection precisely so a service connection cannot reach a user-scoped
      # query. Without strict mode that distinction is decoration.
      - name: Types
        run: uv run mypy

      # No database, no network, no secrets — conftest.py supplies obviously fake
      # configuration. This is what lets CI gate on the suite for a fork PR.
      - name: Pure tests
        run: uv run pytest -m "not integration" -v

  integration:
    name: Integration tests
    runs-on: ubuntu-latest
    needs: check

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: agrosmart_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10

    steps:
      - uses: actions/checkout@v4

      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
          cache-dependency-glob: agroapi/uv.lock

      - name: Install
        run: uv sync --frozen --all-extras

      # Runs the SAME script contributors run locally, rather than a second copy
      # of the setup inline here.
      #
      # It used to be duplicated, on the reasoning that a workflow should not
      # depend on a file in the tree it is testing. That duplication then caused
      # two consecutive red builds on master: the inline copy was missing the
      # table GRANTs the roles need, and then missing the owner/sensor fixtures
      # the ingest tests require. `bash <script>` works regardless of the
      # executable bit, so the original reason did not hold and the drift was
      # pure cost.
      #
      # The script stubs auth.users and auth.uid() (Supabase-only), creates the
      # two roles with the BYPASSRLS asymmetry the security model depends on,
      # applies every migration from agroapp/supabase/migrations, grants the
      # stubbed roles their privileges, and seeds two owners so cross-tenant
      # isolation has a second tenant to fail against.
      - name: Apply migrations and seed fixtures
        env:
          PGHOST: localhost
          PGPORT: "5432"          # the service port; the compose default is 55432
          PGUSER: postgres
          PGDATABASE: agrosmart_test
          PGPASSWORD: postgres
        run: bash scripts/setup_test_db.sh

      # The exit-5 tolerance that used to live here is gone, as its own comment
      # asked: integration tests now exist, so an empty selection means someone
      # deleted or mis-marked them and the build should say so.
      #
      # AGRO_REQUIRE_INTEGRATION_DB turns the conftest's "no database, skip"
      # ergonomics into a hard failure. Locally a skip is right; here the database
      # is a provisioned service, so its absence means the pipeline is broken —
      # and without this flag a container that failed to start would turn every
      # cross-tenant isolation assertion into a silent `s` and report green.
      - name: Integration tests
        env:
          AGRO_DATABASE_URL: postgresql://postgres:postgres@localhost:5432/agrosmart_test
          AGRO_SUPABASE_URL: https://example.supabase.co
          AGRO_TOKEN_PEPPER: ci-pepper-not-a-secret
          AGRO_REQUIRE_INTEGRATION_DB: "1"
        run: uv run pytest -m integration -v

  image:
    name: Docker build
    runs-on: ubuntu-latest
    needs: check

    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3

      # Build only, no push: a PR from a fork must never get registry
      # credentials. Publishing is publish-images.yml, on master.
      - uses: docker/build-push-action@v6
        with:
          context: agroapi
          push: false
          load: true
          tags: agroapi:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max

      # Catches what a successful build does not: a broken entry point. The venv
      # shebang bug that shipped in this Dockerfile's first draft built perfectly
      # and failed only on exec.
      - name: Smoke test the image
        run: |
          docker run -d --name smoke -p 8080:8080 \
            -e AGRO_DATABASE_URL='postgresql://agro_api:x@127.0.0.1:5432/postgres' \
            -e AGRO_SUPABASE_URL='https://example.supabase.co' \
            -e AGRO_TOKEN_PEPPER='ci-pepper' \
            agroapi:ci
          for i in $(seq 1 20); do
            if curl -fsS http://127.0.0.1:8080/v1/health >/dev/null 2>&1; then
              echo "liveness ok after ${i}s"; break
            fi
            sleep 1
          done
          curl -fsS http://127.0.0.1:8080/v1/health | tee /dev/stderr | grep -q '"status":"ok"'

          # Readiness MUST fail here, and that is the assertion: there is no
          # database. A pod that reports ready without one would take traffic it
          # cannot serve.
          code=$(curl -s -o /dev/null -w '%{http_code}' http://127.0.0.1:8080/v1/health/ready)
          test "$code" = "503" || { echo "expected 503 from readiness, got $code"; exit 1; }

          # The container must still be alive. Liveness depends on nothing
          # external precisely so a database outage cannot restart it.
          test "$(docker inspect -f '{{.State.Running}}' smoke)" = "true"

          test "$(docker exec smoke id -u)" = "10001" || { echo "not running as uid 10001"; exit 1; }
